name: iOS Build & Upload to TestFlight

on:
  # Every push to main builds and uploads a new TestFlight build. The build
  # number is github.run_number, which only ever increases, so consecutive
  # pushes cannot collide. Comment this block out to go back to manual-only.
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "screenshots/**"
  workflow_dispatch:
    inputs:
      build_name:
        description: "Version name (e.g. 1.0.3). Leave blank to read it from pubspec.yaml."
        required: false
        default: ""
      build_number:
        description: "Build number — MUST be higher than the last uploaded build (e.g. 36). Leave blank to use the run number."
        required: false
        default: ""

jobs:
  build-and-upload-ios:
    name: Build Flutter IPA and upload to TestFlight
    runs-on: macos-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # ── 2. Flutter ───────────────────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: bijbelstudie_mobile
        run: flutter pub get

      # The App Store icon cannot be uploaded in App Store Connect — since
      # Xcode 9 it is extracted from the 1024x1024 `ios-marketing` entry in the
      # build's asset catalog. So a build carrying a stale catalog silently
      # ships a stale App Store listing icon, which is exactly what happened to
      # 1.0.4. Regenerating here makes assets/images/app_icon.png the single
      # source of truth: whatever that file holds is what the store shows.
      - name: Regenerate launcher icons from assets/images/app_icon.png
        working-directory: bijbelstudie_mobile
        run: |
          dart run flutter_launcher_icons
          git --no-pager diff --stat -- ios/Runner/Assets.xcassets/AppIcon.appiconset || true

      # ── 3. Code signing ──────────────────────────────────────────────────────
      # Secrets required (set in GitHub repo Settings → Secrets and variables → Actions):
      #   BUILD_CERTIFICATE_BASE64      — base64 of your Distribution .p12 certificate
      #   P12_PASSWORD                  — password for the .p12 file
      #   BUILD_PROVISION_PROFILE_BASE64 — base64 of your App Store provisioning profile (.mobileprovision)
      #   KEYCHAIN_PASSWORD             — any random password; used only for the temp keychain

      - name: Import Distribution certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Decode certificate
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"

          # Create a temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate into keychain
          security import "$CERTIFICATE_PATH" \
            -P "$P12_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          # Make keychain visible to codesign
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

          # Allow codesign tools to access the imported key in CI
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          PP_PLIST=$RUNNER_TEMP/build_pp.plist
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/build_pp.mobileprovision

          # Extract metadata so signing can use the exact profile name/UUID
          security cms -D -i "$PP_PATH" > "$PP_PLIST"
          PP_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PP_PLIST")
          PP_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$PP_PLIST")
          PP_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$PP_PLIST")
          APP_BUNDLE_ID="${PP_APP_ID#*.}"

          if ! /usr/libexec/PlistBuddy -c 'Print Entitlements:com.apple.developer.applesignin:0' "$PP_PLIST" >/dev/null 2>&1; then
            echo "Provisioning profile is missing Sign in with Apple entitlement."
            echo "Regenerate the App Store provisioning profile after enabling Sign in with Apple on App ID $APP_BUNDLE_ID."
            exit 1
          fi

          echo "PP_UUID=$PP_UUID" >> $GITHUB_ENV
          echo "PP_NAME=$PP_NAME" >> $GITHUB_ENV
          echo "APP_BUNDLE_ID=$APP_BUNDLE_ID" >> $GITHUB_ENV

          echo "Using provisioning profile: $PP_NAME ($PP_UUID)"
          echo "Provisioning profile app id: $APP_BUNDLE_ID"

      # ── 4. ExportOptions ─────────────────────────────────────────────────────
      # Tells Xcode to export for App Store Connect distribution.
      - name: Create ExportOptions.plist
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > /tmp/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${APP_BUNDLE_ID}</key>
              <string>${PP_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

      # ── 5. Build IPA ─────────────────────────────────────────────────────────
      - name: Build Flutter iOS (unsigned)
        working-directory: bijbelstudie_mobile
        env:
          REVENUECAT_APPLE_KEY: ${{ secrets.REVENUECAT_APPLE_KEY }}
          APPLE_SERVICE_ID: ${{ vars.APPLE_SERVICE_ID }}
          APPLE_REDIRECT_URI: ${{ vars.APPLE_REDIRECT_URI }}
          # Google Sign-In. Optional: leave both unset and the build is
          # byte-for-byte what it was, with the Google button hidden on iOS.
          # Setting them turns it on - see docs/ios-release-setup.md.
          GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: |
          # Version name: use the manual input, else the version from pubspec.yaml.
          BUILD_NAME="${{ github.event.inputs.build_name }}"
          if [ -z "$BUILD_NAME" ]; then
            BUILD_NAME="$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d'+' -f1)"
          fi
          BUILD_NUMBER="${{ github.event.inputs.build_number || github.run_number }}"
          echo "Building $BUILD_NAME ($BUILD_NUMBER)"

          if [ -z "${REVENUECAT_APPLE_KEY:-}" ]; then
            echo "Missing required secret: REVENUECAT_APPLE_KEY"
            exit 1
          fi
          if [ -z "${APPLE_SERVICE_ID:-}" ]; then
            echo "Missing required variable: APPLE_SERVICE_ID"
            exit 1
          fi
          if [ -z "${APPLE_REDIRECT_URI:-}" ]; then
            echo "Missing required variable: APPLE_REDIRECT_URI"
            exit 1
          fi

          # Info.plist carries a placeholder client id so the repo never holds
          # a half-configured OAuth entry. Substitute the real one when the
          # variable is set; skip silently when it is not, in which case the
          # button stays hidden anyway.
          if [ -n "${GOOGLE_IOS_CLIENT_ID:-}" ]; then
            REVERSED="$(printf "%s" "$GOOGLE_IOS_CLIENT_ID" | sed "s/[.]apps[.]googleusercontent[.]com$//")"
            /usr/libexec/PlistBuddy -c "Set :GIDClientID $GOOGLE_IOS_CLIENT_ID" ios/Runner/Info.plist
            /usr/libexec/PlistBuddy -c "Set :CFBundleURLTypes:0:CFBundleURLSchemes:0 com.googleusercontent.apps.$REVERSED" ios/Runner/Info.plist
            echo "Google Sign-In enabled for iOS client $GOOGLE_IOS_CLIENT_ID"
          else
            echo "GOOGLE_IOS_CLIENT_ID not set - Google button stays hidden on iOS."
          fi

          flutter build ios --release --no-codesign \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=USE_PRODUCTION_API=true \
            --dart-define=REVENUECAT_APPLE_KEY="$REVENUECAT_APPLE_KEY" \
            --dart-define=APPLE_SERVICE_ID="$APPLE_SERVICE_ID" \
            --dart-define=APPLE_REDIRECT_URI="$APPLE_REDIRECT_URI" \
            --dart-define=GOOGLE_IOS_CLIENT_ID="${GOOGLE_IOS_CLIENT_ID:-}" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="${GOOGLE_WEB_CLIENT_ID:-}"

      - name: Archive and export signed IPA
        working-directory: bijbelstudie_mobile/ios
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            archive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution"

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath ../build/ios/ipa

          IPA_PATH=$(find ../build/ios/ipa -name "*.ipa" | head -1)
          if [ -z "${IPA_PATH:-}" ]; then
            echo "No IPA file produced."
            exit 1
          fi

          TMP_UNZIP_DIR="$RUNNER_TEMP/ipa_unzip"
          rm -rf "$TMP_UNZIP_DIR"
          mkdir -p "$TMP_UNZIP_DIR"
          unzip -q "$IPA_PATH" -d "$TMP_UNZIP_DIR"

          APP_PATH=$(find "$TMP_UNZIP_DIR/Payload" -maxdepth 2 -name "*.app" | head -1)
          ENTITLEMENTS_PATH="$RUNNER_TEMP/ipa-entitlements.plist"
          if [ -z "${APP_PATH:-}" ]; then
            echo "Could not find .app in exported IPA payload."
            exit 1
          fi

          if codesign -d --entitlements :- "$APP_PATH" > "$ENTITLEMENTS_PATH" 2>/dev/null; then
            if /usr/libexec/PlistBuddy -c "Print com.apple.developer.applesignin" "$ENTITLEMENTS_PATH" >/dev/null 2>&1; then
              echo "Verified: Sign in with Apple entitlement exists in exported IPA."
            else
              echo "::warning::Export succeeded, but com.apple.developer.applesignin is missing from app entitlements in IPA."
              echo "::warning::Apple Sign In may fail at runtime (AuthorizationError 1000) unless the profile/capability setup is corrected."
            fi
          else
            echo "::warning::Could not read codesign entitlements from exported app. Continuing because IPA export succeeded."
          fi

          # ── App icon gate ────────────────────────────────────────────────
          # App Store Connect takes the listing icon out of the build; there is
          # no field to upload it. A build with no CFBundleIconName, or with an
          # asset catalog that never got the current mark, ships a wrong icon
          # and the only remedy is another build. Catch it here instead.
          APP_PLIST="$APP_PATH/Info.plist"

          # Evidence first, verdict second. This gate used to exit with nothing
          # but its own error message, which said to "check
          # ASSETCATALOG_COMPILER_APPICON_NAME" — a setting that is in fact
          # correct in all three Runner configurations. With the xcodebuild log
          # truncated by the Actions log viewer there was then no way to tell
          # whether actool had run at all, whether it produced Assets.car, or
          # whether only the plist merge went missing. Printing the bundle's
          # actual icon state costs one screenful and answers that directly.
          echo "── App icon diagnostics ────────────────────────────────────────"
          echo "Bundle: $APP_PATH"
          echo "-- icon-related Info.plist keys --"
          /usr/libexec/PlistBuddy -c "Print" "$APP_PLIST" 2>/dev/null \
            | grep -iE "icon" || echo "(none)"
          echo "-- AppIcon*.png in bundle --"
          ls -la "$APP_PATH"/AppIcon*.png 2>/dev/null || echo "(none)"
          echo "-- Assets.car --"
          ls -la "$APP_PATH/Assets.car" 2>/dev/null || echo "(none)"
          echo "-- app icon entries inside Assets.car --"
          /usr/bin/xcrun assetutil --info "$APP_PATH/Assets.car" 2>/dev/null \
            | grep -iE '"Name"|"RenditionName"' | grep -i appicon | head -10 \
            || echo "(could not read Assets.car)"
          echo "────────────────────────────────────────────────────────────────"

          if ! /usr/libexec/PlistBuddy -c "Print CFBundleIconName" "$APP_PLIST" >/dev/null 2>&1; then
            echo "CFBundleIconName is missing from the built app."
            echo "The asset catalog itself is not the suspect: the icon set, its"
            echo "image dimensions and ASSETCATALOG_COMPILER_APPICON_NAME have all"
            echo "been verified. Read the diagnostics above to tell the two cases"
            echo "apart — Assets.car present means actool ran and only the"
            echo "Info.plist merge went missing; Assets.car absent means the asset"
            echo "catalog was never compiled into this archive."
            exit 1
          fi

          # The 1024 marketing icon lives only inside Assets.car, so assert on
          # the loose copies Xcode writes alongside it: they are generated from
          # the same set, so if these are current the marketing icon is too.
          if ! ls "$APP_PATH"/AppIcon*.png >/dev/null 2>&1; then
            echo "No AppIcon*.png in the built app bundle. The icon set did not compile."
            exit 1
          fi

          if ! /usr/bin/xcrun assetutil --info "$APP_PATH/Assets.car" 2>/dev/null                | grep -q '"SizeOnDisk"'; then
            echo "::warning::Could not inspect Assets.car; skipping the 1024 icon check."
          else
            echo "Verified: app icon compiled into the build (CFBundleIconName present)."
          fi

      # ── 6. Upload to TestFlight ───────────────────────────────────────────────
      # Secrets required:
      #   APP_STORE_CONNECT_KEY_ID      — Key ID from App Store Connect API key page
      #   APP_STORE_CONNECT_ISSUER_ID   — Issuer ID from App Store Connect API key page
      #   APP_STORE_CONNECT_API_KEY_P8  — base64 of the downloaded .p8 private key file

      - name: Upload IPA to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          set -euo pipefail

          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          mkdir -p "$KEY_DIR"
          echo -n "$APP_STORE_CONNECT_API_KEY_P8" | base64 --decode -o "$KEY_PATH"

          IPA_PATH=$(find bijbelstudie_mobile/build/ios/ipa -name "*.ipa" | head -1)
          echo "Uploading: $IPA_PATH"

          # altool can exit 0 even when Apple rejects the build, so capture the
          # output and fail explicitly on any reported upload error.
          UPLOAD_LOG="$RUNNER_TEMP/altool-upload.log"
          set +e
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --verbose 2>&1 | tee "$UPLOAD_LOG"
          ALTOOL_EXIT=${PIPESTATUS[0]}
          set -e

          if [ "$ALTOOL_EXIT" -ne 0 ] || grep -qiE "UPLOAD FAILED|Failed to upload package|ERROR:" "$UPLOAD_LOG"; then
            echo "::error::TestFlight upload failed. Common cause: the version string is already approved/closed — bump the version (e.g. 1.0.2 → 1.0.3)."
            exit 1
          fi
          echo "Upload accepted by App Store Connect."

      # ── 7. Cleanup ───────────────────────────────────────────────────────────
      - name: Clean up keychain and provisioning profile
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/build_pp.mobileprovision
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8"
